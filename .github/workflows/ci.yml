name: Cross-platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and test/build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile all Python source
        run: python -m compileall -q frameva scripts tests
      - name: Application, renderer, security, and MCP tests
        run: python -m unittest discover -s tests -v
      - name: Check local media tools
        env:
          IMAGEIO_FFMPEG_EXE: ''
        run: python -m frameva doctor
      - name: Build portable Python distribution
        run: python -m build
      - name: Verify wheel from a clean isolated environment
        run: python scripts/verify_wheel.py dist/frameva_studio-0.2.0-py3-none-any.whl
      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: frameva-python-distribution
          path: dist/*
