[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameva-studio"
version = "0.2.0"
description = "Source-aware product launch studio: native Mac worker, live app recordings, and Codex/Claude MCP"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Frameva contributors"}]
keywords = ["video", "product-launch", "mcp", "comfyui", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<0.29",
  "Pillow>=11,<14",
  "python-multipart>=0.0.18,<1",
  "imageio-ffmpeg>=0.6,<0.7",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]
capture = ["playwright>=1.48,<2"]

[project.scripts]
frameva = "frameva.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frameva*"]

[tool.setuptools.package-data]
frameva = ["static/*", "workflows/*.json"]
